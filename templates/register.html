{% extends "base.html" %}
{# 2026-11-02 - smart-voca - 회원가입 화면 (가입자는 항상 일반 사용자 역할) #}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="brand"><span class="logo">📘</span> 회원가입</div>
        <p class="muted center" style="margin-bottom:22px">계정을 만들고 나만의 학습 기록을 시작하세요</p>
        <form method="post" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <label for="username">아이디</label>
                <input id="username" name="username" value="{{ username }}" autocomplete="username" autofocus required>
                <p class="hint">영문·숫자·밑줄 3~20자</p>
            </div>
            <div class="field">
                <label for="display_name">표시 이름 <span class="muted">(선택)</span></label>
                <input id="display_name" name="display_name" value="{{ display_name }}" maxlength="30">
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
                <p class="hint">6자 이상</p>
            </div>
            <div class="field">
                <label for="password_confirm">비밀번호 확인</label>
                <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
            </div>
            <button class="btn block" type="submit">가입하고 시작하기</button>
        </form>
        <p class="center small muted" style="margin-top:18px">이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
    </div>
</div>
{% endblock %}
