{% extends "base.html" %}
{# 2026-11-02 - smart-voca - 사용자 설정: 하루 학습량, 테마, 내 기록 초기화 #}
{% block title %}설정{% endblock %}
{% block content %}
<div class="page-head"><div><h1>설정</h1><p>나에게 맞게 조절해요.</p></div></div>
<div class="grid grid-2">
    <section class="card">
        <h2 style="margin-bottom:14px">학습 환경</h2>
        <form id="settings-form">
            <div class="field">
                <label for="daily_target">하루 학습 단어 수</label>
                <input id="daily_target" type="number" min="1" required>
                <p class="hint" id="target-hint"></p>
            </div>
            <div class="field">
                <label>화면 테마</label>
                <div class="seg" id="theme">
                    <label><input type="radio" name="theme" value="system"><span>시스템</span></label>
                    <label><input type="radio" name="theme" value="light"><span>☀️ 라이트</span></label>
                    <label><input type="radio" name="theme" value="dark"><span>🌙 다크</span></label>
                </div>
            </div>
            <button class="btn" type="submit">저장</button>
        </form>
    </section>
    <section class="card">
        <h2 style="margin-bottom:6px">내 학습 기록</h2>
        <p class="muted small" style="margin-bottom:14px">학습·시험 기록과 단어별 통계가 모두 삭제되며 되돌릴 수 없어요. 다른 사용자에게는 영향이 없어요.</p>
        <button id="btn-reset" class="btn danger outline" type="button">내 기록 초기화</button>
    </section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/settings.js') }}"></script>{% endblock %}
